# grpo-m3-ckpt60 as Q4_K_M (A3 parity, dev only), served on port 8081 so it can run beside another server. Same prompt, template and harness as the Q8_0 config.
# M1 (SFT) served from a merged GGUF in llama.cpp, the deployment path (D-028). Phase 1 protocol: prompt v1, spec-first.
# Replace gguf_file with the merged model once trained; the AGENT chat template must be loaded (D-026), and
# `chat_template_kwargs` must NOT be passed (the stock enable_thinking switch does not exist in our template).
server_args = "--jinja --chat-template-file packages/protocol/prompts/chat-template.jinja -ngl 99 -c 8192 -np 1 --cache-ram 0 --seed 20261115"
base_url = "http://127.0.0.1:8081/v1"
model = "grpo-m3-ckpt60-q4km"
quant = "Q4_K_M"
gguf_file = "grpo-m3-ckpt60-q4_k_m.gguf"
temperature = 0.0
max_tokens = 512
system_prompt = "system-v1.txt"
require_spec = true
stop_after_ask = true
