# M3 GGUF in the browser: wllama (llama.cpp WebAssembly, CPU and WebGPU) inside Chromium, driven by eval/browser_parity.py.
# Same protocol as eval/configs/grpo-m3-ckpt60-q8.toml (prompt v1, spec-first, greedy, 512 new tokens, agent chat template D-026).
# The prompt string is built by ffwd-web's own JS port of the template and passed as a plain-text completion; the runtime's
# chat template is never used. There is no llama-server, so base_url / server_args do not exist.
model = "m3-browser-gguf"
quant = "see the run manifest"
temperature = 0.0
max_tokens = 512
system_prompt = "system-v1.txt"
require_spec = true
stop_after_ask = true
