<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ffmpeg-agent spike</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 52rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      fieldset {
        margin: 1rem 0;
      }
      label {
        display: block;
        margin: 0.3rem 0;
      }
      li {
        font:
          13px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <h1>ffmpeg-agent Phase 0 browser spike</h1>
    <p>
      Cross-origin isolated: <strong id="isolated">?</strong> · Status:
      <span id="status" role="status" aria-live="polite">idle</span>
    </p>
    <fieldset>
      <legend>Inputs (from data/corpus; nothing is uploaded)</legend>
      <label
        >HEVC clip (hevc_iphone.mov) <input id="hevc-file" type="file" accept="video/*"
      /></label>
      <label>Long clip (h264_long.mp4) <input id="long-file" type="file" accept="video/*" /></label>
      <label
        >Large file for the memory test (100 MB / 500 MB)
        <input id="big-file" type="file" accept="video/*"
      /></label>
      <label>Machine label <input id="machine" placeholder="e.g. owner-laptop" /></label>
    </fieldset>
    <fieldset>
      <legend>
        Phase 2 bench (files from data/bench, see
        reports/2026-11-16-phase0-followups/bench/README.md)
      </legend>
      <label>HEVC 1080p 60 s <input id="bench-hevc1080" type="file" accept="video/*" /></label>
      <label>HEVC 4K 60 s <input id="bench-hevc4k" type="file" accept="video/*" /></label>
      <label
        >H.264 ~100 MB (60 s) <input id="bench-h264-100mb" type="file" accept="video/*"
      /></label>
      <label
        >H.264 ~500 MB (60 s) <input id="bench-h264-500mb" type="file" accept="video/*"
      /></label>
      <button id="run-bench">Run full bench (uses the model selected below)</button>
      <button id="clear-saved">Clear saved results</button>
      <p>
        GPU policy: <strong id="gpu-policy">?</strong> (add <code>?gpuPolicy=refuse</code> to the
        URL to refuse integrated GPUs)
      </p>
    </fieldset>
    <button id="run-ffmpeg">1. ffmpeg.wasm checks</button>
    <label
      >Model
      <select id="model"></select
    ></label>
    <label><input id="json-mode" type="checkbox" /> JSON-constrained output</label>
    <button id="run-scripted">1b. Scripted loop (no model)</button>
    <button id="run-model">2. WebLLM load, speed, F1/F4/F7 loop</button>
    <button id="run-memory">3. Memory test on large file</button>
    <button id="download">Download results JSON</button>
    <ol id="log"></ol>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
