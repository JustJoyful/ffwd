<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ffmpeg-agent spike</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 52rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      fieldset {
        margin: 1rem 0;
      }
      label {
        display: block;
        margin: 0.3rem 0;
      }
      li {
        font:
          13px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <h1>ffmpeg-agent Phase 0 browser spike</h1>
    <p>
      Cross-origin isolated: <strong id="isolated">?</strong> · Status:
      <span id="status" role="status" aria-live="polite">idle</span>
    </p>
    <fieldset>
      <legend>Inputs (from data/corpus; nothing is uploaded)</legend>
      <label
        >HEVC clip (hevc_iphone.mov) <input id="hevc-file" type="file" accept="video/*"
      /></label>
      <label>Long clip (h264_long.mp4) <input id="long-file" type="file" accept="video/*" /></label>
      <label
        >Large file for the memory test (100 MB / 500 MB)
        <input id="big-file" type="file" accept="video/*"
      /></label>
      <label>Machine label <input id="machine" placeholder="e.g. owner-laptop" /></label>
    </fieldset>
    <button id="run-ffmpeg">1. ffmpeg.wasm checks</button>
    <label
      >Model
      <select id="model"></select
    ></label>
    <button id="run-model">2. WebLLM load, speed, F1/F4/F7 loop</button>
    <button id="run-memory">3. Memory test on large file</button>
    <button id="download">Download results JSON</button>
    <ol id="log"></ol>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
