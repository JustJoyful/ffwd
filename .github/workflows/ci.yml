name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install the pinned FFmpeg (D-024)
        run: uv run python -m training.env.ffmpeg_pin install
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pytest


  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/browser
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0 # same as the owner's local pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test # includes the TS validator against packages/protocol/conformance
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e # isolation smoke test; ffmpeg e2e skips without the local corpus
